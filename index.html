    <!--copy email script-->
    <script>
    const emailEl = document.getElementById("copy-email");
    const email = emailEl.textContent.trim();

    function copyEmail() {
        navigator.clipboard.writeText(email).then(() => {
            emailEl.textContent = "Copied!";
            setTimeout(() => emailEl.textContent = email, 1500);

        });
        // needs to be able to copy with enter for accessibility

    }
    emailEl.addEventListener("click", copyEmail);
    emailEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {    
            copyEmail();
        }
    });
    </script>

    <!--Plyr must load before the modal script-->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <!--modal script-->
    <script>
    const modal = document.getElementById("project-modal");
    const modalEmbed = document.getElementById("modal-embed");
    const modalVideo = document.getElementById("modal-video");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-description");

    // Plyr is optional: if it fails to load, native controls are used
    const player = (typeof Plyr !== "undefined") ? new Plyr(modalVideo) : null;

    function isStream(url) {
        return url.includes("savedly.net/api/stream");
    }

    function videoWrapper() {
        return modalVideo.closest(".plyr") || modalVideo;
    }

    function stopMedia() {
        modalEmbed.removeAttribute("src");
        if (player) player.stop(); else modalVideo.pause();
    }

    function openModal(item) {
        const link = item.dataset.link;
        if (link) {
            modalTitle.innerHTML = "";
            const a = document.createElement("a");
            a.href = link;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.dataset.title;
            modalTitle.appendChild(a);
        } else {
            modalTitle.textContent = item.dataset.title;
        }
        modalDesc.innerHTML = item.dataset.description;

        const url = item.dataset.embed || "";
        const wrap = videoWrapper();

        if (url && isStream(url)) {
            modalEmbed.style.display = "none";
            wrap.style.display = "block";
            if (player) {
                player.source = { type: "video", sources: [{ src: url, type: "video/mp4" }] };
            } else {
                modalVideo.src = url;
            }
        } else {
            wrap.style.display = "none";
            modalEmbed.style.display = url ? "block" : "none";
            if (url) modalEmbed.src = url;
        }

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        stopMedia();
    }

    document.querySelectorAll(".images").forEach(item => {
        item.addEventListener("click", () => openModal(item));
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    </script>
